name: oracle

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  oracle-test:
    name: oracle (reference only) — clojure -M:test (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    steps:
      - name: oracle notice
        run: echo "ORACLE job - reference measurement only, not a gate, not a required check, no native build or gate depends on it (AGENTS.md CI exception, JUN-579)."
      - uses: actions/checkout@v4
      - name: check no deleted-repo pins remain
        run: |
          python3 - <<'EOF'
          import re, sys
          txt = open('deps.edn').read()
          bad = []
          for i, ln in enumerate(txt.split('\n'), 1):
              for m in re.finditer(r':git/url\s+"(https://github\.com/kotoba-lang/([a-zA-Z0-9_.\-]+?)(\.git)?)"', ln):
                  if m.group(2) not in ('kotoba', 'amu'):
                      bad.append('%d: dead repo URL %s' % (i, m.group(1)))
          for m in re.finditer(r"((?:io\.github\.kotoba-lang|kotoba-lang|gftd)/[a-zA-Z0-9_.\-]+)\s*\n?\s*(\{[^{}]*\})", txt):
              key, block = m.group(1), m.group(2)
              if key in ("io.github.kotoba-lang/amu", "kotoba-lang/amu"):
                  continue
              if ":git/url" not in block and re.search(r":git/sha\s+\" [0-9a-f]+\"|:sha\s+\" [0-9a-f]+\"", block):
                  bad.append('%d: bare git sha without :git/url: %s' % (txt[:m.start()].count("\n") + 1, key))
          if bad:
              print("deleted-repo pins remain:")
              [print("  " + b) for b in bad]
              sys.exit(1)
          print("pins OK: no deleted kotoba-lang repo URLs or bare shas")
          EOF

      - name: Setup JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Setup Clojure CLI
        uses: DeLaGuardo/setup-clojure@13.1
        with:
          cli: latest
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache m2 / gitlibs
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2
            ~/.gitlibs
          key: ${{ runner.os }}-jdk${{ matrix.java }}-clj-${{ hashFiles('deps.edn') }}
          restore-keys: |
            ${{ runner.os }}-jdk${{ matrix.java }}-clj-

      - name: Run tests
        run: clojure -M:test

      - name: Lint
        run: clojure -M:lint

  # 2026-07-18 addendum to Decision 4 (docs/adr/0001-architecture.md) — real
  # WebGPU render verification. macOS runner: ADR-2607078000 Addendum 8
  # found Linux/SwiftShader WebGPU unreliable (blank canvases,
  # popErrorScope errors), macOS reliable (real Metal-backed GPU process,
  # no special launch flags needed) — same finding kami-app-amenominaka's
  # own webgpu-smoke job relies on.
  oracle-webgpu-smoke:
    name: oracle (reference only) — real-browser WebGPU render verification
    runs-on: macos-latest
    steps:
      - name: oracle notice
        run: echo "ORACLE job - reference measurement only, not a gate, not a required check, no native build or gate depends on it (AGENTS.md CI exception, JUN-579)."
      - uses: actions/checkout@v4
        with: {path: kami-app-hygaccess-plant}

      # kotoba-lang/webgpu itself, plus its own ~20 :local/root siblings
      # (deps.edn's :cljs alias comment has the full account of why each is
      # here). actions/checkout forbids `path:` escaping $GITHUB_WORKSPACE
      # via `../`, so every repo checks out as a DIRECT CHILD of
      # $GITHUB_WORKSPACE — matching the sibling layout deps.edn's
      # :local/root ("../webgpu" etc., relative to THIS repo's own checkout)
      # needs, since $GITHUB_WORKSPACE/kami-app-hygaccess-plant/../webgpu ==
      # $GITHUB_WORKSPACE/webgpu.
      - uses: actions/checkout@v4
        id: checkout-webgpu
        continue-on-error: true
        with: {repository: kotoba-lang/webgpu, path: webgpu}
      - uses: actions/checkout@v4
        id: checkout-org-w3-webgpu
        continue-on-error: true
        with: {repository: kotoba-lang/org-w3-webgpu, path: org-w3-webgpu}
      - uses: actions/checkout@v4
        id: checkout-wgsl
        continue-on-error: true
        with: {repository: kotoba-lang/wgsl, path: wgsl}
      - uses: actions/checkout@v4
        id: checkout-expr
        continue-on-error: true
        with: {repository: kotoba-lang/expr, path: expr}
      - uses: actions/checkout@v4
        id: checkout-sprite-gpu
        continue-on-error: true
        with: {repository: kotoba-lang/sprite-gpu, path: sprite-gpu}
      - uses: actions/checkout@v4
        id: checkout-sprite2d
        continue-on-error: true
        with: {repository: kotoba-lang/sprite2d, path: sprite2d}
      - uses: actions/checkout@v4
        id: checkout-sky
        continue-on-error: true
        with: {repository: kotoba-lang/sky, path: sky}
      - uses: actions/checkout@v4
        id: checkout-shaders
        continue-on-error: true
        with: {repository: kotoba-lang/shaders, path: shaders}
      - uses: actions/checkout@v4
        id: checkout-render
        continue-on-error: true
        with: {repository: kotoba-lang/render, path: render}
      - uses: actions/checkout@v4
        id: checkout-render-shaders
        continue-on-error: true
        with: {repository: kotoba-lang/render-shaders, path: render-shaders}
      - uses: actions/checkout@v4
        id: checkout-scene2d
        continue-on-error: true
        with: {repository: kotoba-lang/scene2d, path: scene2d}
      - uses: actions/checkout@v4
        id: checkout-gpu
        continue-on-error: true
        with: {repository: kotoba-lang/gpu, path: gpu}
      - uses: actions/checkout@v4
        id: checkout-webgl
        continue-on-error: true
        with: {repository: kotoba-lang/webgl, path: webgl}
      - uses: actions/checkout@v4
        id: checkout-dance
        continue-on-error: true
        with: {repository: kotoba-lang/dance, path: dance}
      - uses: actions/checkout@v4
        id: checkout-physics
        continue-on-error: true
        with: {repository: kotoba-lang/physics, path: physics}
      - uses: actions/checkout@v4
        id: checkout-fsm
        continue-on-error: true
        with: {repository: kotoba-lang/fsm, path: fsm}
      - uses: actions/checkout@v4
        id: checkout-netsync
        continue-on-error: true
        with: {repository: kotoba-lang/netsync, path: netsync}
      - uses: actions/checkout@v4
        id: checkout-pipelines
        continue-on-error: true
        with: {repository: kotoba-lang/pipelines, path: pipelines}
      - uses: actions/checkout@v4
        id: checkout-level
        continue-on-error: true
        with: {repository: kotoba-lang/level, path: level}
      - uses: actions/checkout@v4
        id: checkout-host
        continue-on-error: true
        with: {repository: kotoba-lang/host, path: host}
      - uses: actions/checkout@v4
        id: checkout-playwright
        continue-on-error: true
        with: {repository: kotoba-lang/playwright, path: playwright}
      - uses: actions/checkout@v4
        id: checkout-cartpole-math
        continue-on-error: true
        with: {repository: kotoba-lang/cartpole-math, path: cartpole-math}
      # host's own further :local/root deps (deps.edn :cljs alias comment).
      - uses: actions/checkout@v4
        id: checkout-kami-engine-sdk
        continue-on-error: true
        with: {repository: kotoba-lang/kami-engine-sdk, path: kami-engine-sdk}
      - uses: actions/checkout@v4
        id: checkout-physics-2d
        continue-on-error: true
        with: {repository: kotoba-lang/physics-2d, path: physics-2d}

      - name: probe render siblings (skip smoke when unavailable)
        id: siblings-probe
        continue-on-error: true
        run: |
          missing=""
          for d in webgpu org-w3-webgpu wgsl expr sprite-gpu sprite2d sky shaders render render-shaders scene2d gpu webgl dance physics fsm netsync pipelines level host playwright cartpole-math kami-engine-sdk physics-2d; do
            if [ ! -d "$d" ]; then missing="$missing $d"; fi
          done
          if [ -n "$missing" ]; then echo "missing sibling checkouts:$missing"; exit 1; fi
          echo "all render siblings present"

      - uses: DeLaGuardo/setup-clojure@13.1
        if: steps.siblings-probe.outcome == 'success'
        
        with:
          cli: latest
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        if: steps.siblings-probe.outcome == 'success'
        
        with:
          node-version: 22

      - run: npm install
        if: steps.siblings-probe.outcome == 'success'
        
        working-directory: kami-app-hygaccess-plant
      - run: npx playwright install chromium
        if: steps.siblings-probe.outcome == 'success'
        
        working-directory: kami-app-hygaccess-plant
      - run: npx shadow-cljs compile render-demo
        if: steps.siblings-probe.outcome == 'success'
        
        working-directory: kami-app-hygaccess-plant
      - run: npx nbb -cp test/render test/render/verify_render.cljk
        if: steps.siblings-probe.outcome == 'success'
        
        working-directory: kami-app-hygaccess-plant

      - name: oracle skipped - render siblings unavailable (notice, not a failure)
        if: steps.siblings-probe.outcome != 'success'
        run: |
          echo 'NOTICE - skipping real-browser WebGPU render verification: one or more of the 24 kotoba-lang sibling checkouts (webgpu, org-w3-webgpu, wgsl, expr, sprite-gpu, sprite2d, sky, shaders, render, render-shaders, scene2d, gpu, webgl, dance, physics, fsm, netsync, pipelines, level, host, playwright, cartpole-math, kami-engine-sdk, physics-2d) are unavailable (repos deleted in the kotoba monorepo move). Dev decision, Itonami Bots item 134; tracking: AWAI-3835. The -M:test job above still ran.'
          echo "::notice ::oracle skipped WebGPU smoke (deleted kotoba-lang sibling repos). See AWAI-3835."

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: render-screenshot
          path: kami-app-hygaccess-plant/test/render/render-screenshot.png
          if-no-files-found: ignore
